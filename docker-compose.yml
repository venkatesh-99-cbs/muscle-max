# Spins up the exact same environment for all 5 team members.
# Usage: docker compose up --build
version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16   # Postgres 16 + pgvector extension pre-installed
    container_name: musclemax_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-musclemax}
      POSTGRES_USER: ${POSTGRES_USER:-musclemax}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-musclemax}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-musclemax}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: musclemax_backend
    restart: unless-stopped
    env_file: ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

  frontend:
    build: ./frontend
    container_name: musclemax_frontend
    restart: unless-stopped
    env_file: ./frontend/.env
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  pgdata:
